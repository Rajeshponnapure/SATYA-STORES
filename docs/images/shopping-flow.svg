<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Satya Stores shopping and fulfillment flow</title>
  <desc id="desc">A customer browses and checks out, submits a payment, the store verifies it, then fulfills and tracks the order.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="56" y="65" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#2563eb">CUSTOMER JOURNEY</text>
  <text x="56" y="105" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#0f172a">From product discovery to delivery tracking</text>
  <path d="M260 248h57M546 248h57M832 248h57" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="160" width="204" height="180" rx="22" fill="#fff"/>
    <rect x="342" y="160" width="204" height="180" rx="22" fill="#fff"/>
    <rect x="628" y="160" width="204" height="180" rx="22" fill="#fff"/>
    <rect x="914" y="160" width="230" height="180" rx="22" fill="#fff"/>
  </g>
  <g font-family="Arial,sans-serif">
    <circle cx="88" cy="197" r="19" fill="#dbeafe"/><text x="82" y="203" font-size="16" font-weight="800" fill="#1d4ed8">1</text>
    <text x="76" y="245" font-size="19" font-weight="800" fill="#0f172a">Discover</text>
    <text x="76" y="274" font-size="13" fill="#475569">Search, browse categories,</text><text x="76" y="294" font-size="13" fill="#475569">compare product details.</text>
    <rect x="76" y="310" width="110" height="22" rx="11" fill="#eff6ff"/><text x="88" y="325" font-size="11" font-weight="700" fill="#1d4ed8">Storefront</text>

    <circle cx="374" cy="197" r="19" fill="#dbeafe"/><text x="368" y="203" font-size="16" font-weight="800" fill="#1d4ed8">2</text>
    <text x="362" y="245" font-size="19" font-weight="800" fill="#0f172a">Checkout</text>
    <text x="362" y="274" font-size="13" fill="#475569">Cart, delivery details,</text><text x="362" y="294" font-size="13" fill="#475569">shipping and payment.</text>
    <rect x="362" y="310" width="120" height="22" rx="11" fill="#eff6ff"/><text x="374" y="325" font-size="11" font-weight="700" fill="#1d4ed8">Customer account</text>

    <circle cx="660" cy="197" r="19" fill="#fef3c7"/><text x="654" y="203" font-size="16" font-weight="800" fill="#b45309">3</text>
    <text x="648" y="245" font-size="19" font-weight="800" fill="#0f172a">Verify payment</text>
    <text x="648" y="274" font-size="13" fill="#475569">UPI / bank proof reviewed</text><text x="648" y="294" font-size="13" fill="#475569">by the store, or Razorpay.</text>
    <rect x="648" y="310" width="122" height="22" rx="11" fill="#fef3c7"/><text x="660" y="325" font-size="11" font-weight="700" fill="#92400e">Admin dashboard</text>

    <circle cx="946" cy="197" r="19" fill="#d1fae5"/><text x="940" y="203" font-size="16" font-weight="800" fill="#047857">4</text>
    <text x="934" y="245" font-size="19" font-weight="800" fill="#0f172a">Fulfill &amp; track</text>
    <text x="934" y="274" font-size="13" fill="#475569">Stock updates, delivery</text><text x="934" y="294" font-size="13" fill="#475569">status, order timeline.</text>
    <rect x="934" y="310" width="150" height="22" rx="11" fill="#d1fae5"/><text x="946" y="325" font-size="11" font-weight="700" fill="#047857">Inventory + orders</text>
  </g>
  <rect x="56" y="390" width="1088" height="74" rx="20" fill="url(#accent)"/>
  <text x="84" y="422" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#bfdbfe">DESIGNED FOR SMALL SCREENS</text>
  <text x="84" y="447" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Touch-friendly navigation · product cards · account access · persistent cart</text>
</svg>
